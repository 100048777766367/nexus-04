name: Nexus-04 Fractal Mitosis & Reliquary Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Chạy tự động mỗi 4 tiếng (lệch phút 30 để tránh nghẽn mạng P2P)
    - cron: '30 */4 * * *'

permissions:
  contents: write

jobs:
  run-nexus04-fractal:
    runs-on: ubuntu-latest
    steps:
      # BƯỚC 1: KÉO MÃ NGUỒN BẰNG SHELL GỐC (THOÁT LY NODE.JS RUNNER)
      - name: Kéo mã nguồn Nexus-04
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # BƯỚC 2: THIẾT LẬP PYTHON 3.10
      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # BƯỚC 3: VẬN HÀNH VI NHÂN F4 (PHÂN BÀO ĐỆ QUY & PHÒNG DANH VỌNG)
      - name: Vận hành Vi Nhân Fractal Nexus-04
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      # BƯỚC 4: LƯU VẾT TÍCH TIẾN HÓA, PHÂN BÀO VÀ BẢN THỜ TỔ TIÊN
      - name: Lưu vết tích phân bào và phong tước vào Git
        run: |
          git config --global user.name "Nexus-04-Fractal-Bot"
          git config --global user.email "bot@nexus04.fractal.node"
          
          # CẤP TOKEN BẢO MẬT ĐỂ PUSH (MIỄN NHIỄM 100% MÃ LỖI 128)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          
          # GOM TOÀN BỘ BIẾN ĐỘNG SINH HỌC CỦA NEXUS-04:
          # 1. Toàn bộ thư mục cơ quan mới sinh (*_organ), tệp con cháu, và di tích (*.ancestral_relic)
          git add -A mechanisms/
          # 2. Toàn bộ túi nhớ: ancestral_reliquary.json, honors_registry.json, knowledge_graph.json...
          git add -A synapses/
          # 3. Hai gói tin phát sóng tiến và lùi
          git add synapse_forward.json synapse_backward.json 2>/dev/null || true
          
          # NẾU CÓ BIẾN ĐỔI (PHÂN BÀO / TRAO HUY CHƯƠNG / HỘI TỤ MỚI) THÌ COMMIT
          if ! git diff --staged --quiet; then
            git commit -m "🏵️ [Nexus-04 F4] Phân bào đệ quy & Khắc cốt bia tưởng niệm dòng họ #(1+N) [skip ci]"
            git push origin main
          else
            echo "Mạng lưới và tế bào tĩnh lặng, không có biến đổi mới."
          fi
